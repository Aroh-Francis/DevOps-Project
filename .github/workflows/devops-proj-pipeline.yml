name: Build and Deploy Image

on:
  push:
     branches: [main] 
     paths-ignore:
         - 'deployment.yml'
    


jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch all history for all branches and tags
         
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate version tag (timestamp)
        id: tag
        run: echo "value=$(date +'%Y-%m-%d-%H%M%S')" >> $GITHUB_OUTPUT
        # VERSION=2025-12-11-143025
        # Image name: 
     
      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:${{ steps.tag.outputs.value }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:${{ steps.tag.outputs.value }}

      - name: Update deployment.yaml and commit
        run: |
        #search for the line starting with "image:" and replace it with the new image name and tag
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:${{ steps.tag.outputs.value }}|" deployment.yaml  
          #log into github and commit the changes to deployment.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "Deploy new image ${{ steps.tag.outputs.value }}"
          git push



   