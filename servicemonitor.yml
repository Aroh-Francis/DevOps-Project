apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-project
  namespace: prometheus
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: devops-project
  namespaceSelector:
    matchNames:
    - default
  endpoints:
  - port: http
    path: /metrics
    interval: 15s